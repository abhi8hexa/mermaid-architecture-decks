- name: Build Docker image
  run: docker build -t mermaid-pptx .

- name: Generate PPTX using Docker
  run: |
    mkdir -p output
    docker run --rm \
      -v ${{ github.workspace }}/output:/app/output \
      mermaid-pptx

- name: Upload PPTX artifacts
  uses: actions/upload-artifact@v4
  with:
    name: architecture-decks
    path: output/*.pptx