name: Generate Architecture PPTX

on:
  push:
    paths:
      - diagrams/**
      - src/**
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Generate PPTX files
        run: |
          mkdir -p output
          for f in diagrams/*.mmd; do
            name=$(basename "$f" .mmd)
            npm run build:pptx "$f" "output/$name.pptx"
          done

      - name: Upload PPTX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: architecture-decks
          path: output/*.pptx
``